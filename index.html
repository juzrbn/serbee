<body>

<div id="root"></div>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;



const MONTHS = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const MONTHS_FULL = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const WEEKDAYS = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const WEEKDAYS_FULL = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const TODAY = new Date();

// Regionale Trachten — dynamisch nach Breitengrad
// Basis: 48°N (Oberbayern). Pro Grad südlicher: ~3 Tage früher. Pro Grad nördlicher: ~3 Tage später.
function getTrachtenForLat(lat) {
  var shift = Math.round((lat - 48) * 3);
  function s(m, d) { var nd = d + shift, nm = m; while (nd > 28) { nd -= 30; nm++; } while (nd < 1) { nd += 30; nm--; } return [Math.max(0, Math.min(11, nm)), Math.max(1, Math.min(28, nd))]; }
  var t = [];
  t.push({ name: "Löwenzahn", emoji: "🌼", start: s(3,5), end: s(4,20), color: "#fde047" });
  t.push({ name: "Obstblüte", emoji: "🌸", start: s(3,15), end: s(4,15), color: "#f472b6" });
  if (lat < 55) t.push({ name: "Raps", emoji: "💛", start: s(3,25), end: s(5,5), color: "#facc15" });
  if (lat < 52) {
    t.push({ name: "Robinie", emoji: "🌿", start: s(5,1), end: s(5,20), color: "#4ade80" });
  } else {
    t.push({ name: "Robinie", emoji: "🌿", start: s(5,10), end: s(5,28), color: "#4ade80" });
  }
  t.push({ name: "Linde", emoji: "🌳", start: s(5,15), end: s(6,25), color: "#34d399" });
  t.push({ name: "Wald/Honigtau", emoji: "🌲", start: s(5,1), end: s(7,31), color: "#2dd4bf" });
  if (lat < 46) {
    t.push({ name: "Sonnenblume", emoji: "🌻", start: s(5,15), end: s(7,15), color: "#fbbf24" });
    t.push({ name: "Akazie", emoji: "🌾", start: s(4,15), end: s(5,10), color: "#86efac" });
  } else if (lat > 53) {
    t.push({ name: "Heide", emoji: "💜", start: s(7,1), end: s(8,15), color: "#a78bfa" });
    t.push({ name: "Wiesenblumen", emoji: "🌺", start: s(4,15), end: s(7,31), color: "#c084fc" });
  } else {
    t.push({ name: "Wiesenblumen", emoji: "🌺", start: s(4,15), end: s(7,31), color: "#c084fc" });
    t.push({ name: "Phacelia", emoji: "💜", start: s(5,15), end: s(8,15), color: "#a78bfa" });
  }
  return t;
}
var TRACHTEN = getTrachtenForLat(48.14);
const SCHWARMZEIT = { start: [3, 15], end: [5, 30] };

const STANDORTE = [
  { name: "München", lat: 48.14, lon: 11.58 },
  { name: "Berlin", lat: 52.52, lon: 13.41 },
  { name: "Hamburg", lat: 53.55, lon: 9.99 },
  { name: "Köln", lat: 50.94, lon: 6.96 },
  { name: "Frankfurt", lat: 50.11, lon: 8.68 },
  { name: "Stuttgart", lat: 48.78, lon: 9.18 },
  { name: "Nürnberg", lat: 49.45, lon: 11.08 },
  { name: "Dresden", lat: 51.05, lon: 13.74 },
  { name: "Freiburg", lat: 47.99, lon: 7.85 },
  { name: "Wien", lat: 48.21, lon: 16.37 },
  { name: "Zürich", lat: 47.38, lon: 8.54 },
  { name: "Salzburg", lat: 47.80, lon: 13.04 },
];

function isInRange(date, start, end, year) {
  return date >= new Date(year, start[0], start[1]) && date <= new Date(year, end[0], end[1]);
}
function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function getFirstDayOfMonth(y, m) { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; }
function fmt(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseD(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function loadData(k, fb) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch(e) { return fb; } }
function saveData(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

const wIcon = (code) => {
  if (code == null) return "❓";
  if (code <= 1) return "☀️"; if (code <= 3) return "⛅"; if (code <= 48) return "☁️";
  if (code <= 67) return "🌧️"; if (code <= 77) return "🌨️"; if (code <= 82) return "🌧️";
  if (code <= 86) return "🌨️"; return "⛈️";
};
const wLabel = (code) => {
  if (code == null) return "—";
  if (code <= 1) return "Sonnig"; if (code <= 2) return "Teilw. bewölkt"; if (code <= 3) return "Bewölkt";
  if (code <= 48) return "Nebel"; if (code <= 55) return "Nieselregen"; if (code <= 67) return "Regen";
  if (code <= 77) return "Schneefall"; if (code <= 82) return "Regenschauer"; if (code <= 86) return "Schneeschauer";
  return "Gewitter";
};

const DEFAULT_VOELKER = [
  { id: 1, name: "Volk 1", color: "#f59e0b" },
  { id: 2, name: "Volk 2", color: "#60a5fa" },
  { id: 3, name: "Volk 3", color: "#34d399" },
];

const C = {
  bg: "#0f1117", surface: "#181b23", surfaceLight: "#1e2130",
  border: "#2a2d3a", borderLight: "#363a4a",
  text: "#e2e4ec", textMuted: "#8b8fa3", textDim: "#5c6078",
  accent: "#f59e0b", accentGlow: "rgba(245,158,11,0.15)",
  danger: "#ef4444", dangerDim: "rgba(239,68,68,0.15)",
  success: "#10b981", successDim: "rgba(16,185,129,0.15)",
  schwarm: "rgba(251,146,60,0.12)", schwarmBorder: "#c2410c",
};

function SchwarmzeitKalender() {
  const [year, setYear] = useState(TODAY.getFullYear());
  const [month, setMonth] = useState(TODAY.getMonth());
  const [selectedDate, setSelectedDate] = useState(null);
  const [voelker, setVoelker] = useState(() => loadData("sz_voelker", DEFAULT_VOELKER));
  const [kontrollen, setKontrollen] = useState(() => loadData("sz_kontrollen", {}));
  const [notizen, setNotizen] = useState(() => loadData("sz_notizen", {}));
  const [showAddVolk, setShowAddVolk] = useState(false);
  const [newVolkName, setNewVolkName] = useState("");
  const [noteText, setNoteText] = useState("");
  const [noteVolk, setNoteVolk] = useState(null);
  const [weather, setWeather] = useState({});
  const [weatherLoaded, setWeatherLoaded] = useState(false);
  const [weatherError, setWeatherError] = useState(null);
  const [activeTab, setActiveTab] = useState("kalender");

  // Location state
  const [standort, setStandort] = useState(() => loadData("sz_standort", STANDORTE[0]));
  const [trachten, setTrachten] = useState(() => getTrachtenForLat(loadData("sz_standort", STANDORTE[0]).lat || 48.14));
  const [showOrtAuswahl, setShowOrtAuswahl] = useState(false);
  const [customLat, setCustomLat] = useState("");
  const [customLon, setCustomLon] = useState("");
  const [customName, setCustomName] = useState("");
  const [searchCity, setSearchCity] = useState("");
  const [searchResults, setSearchResults] = useState([]);
  const [searching, setSearching] = useState(false);

  // Ernte tracking
  const [ernten, setErnten] = useState(() => loadData("sz_ernten", []));
  const [showAddErnte, setShowAddErnte] = useState(false);
  const [ernteForm, setErnteForm] = useState({ volkId: null, tracht: "", kg: "", datum: fmt(TODAY), notiz: "" });

  // Stockkarte
  const [stockkarten, setStockkarten] = useState(() => loadData("sz_stockkarten", []));
  const [skVolkId, setSkVolkId] = useState(null);
  const [showSkForm, setShowSkForm] = useState(false);
  const [skForm, setSkForm] = useState({ datum: fmt(TODAY), volkId: null, staerke: 0, wabensitz: 0, sanftmut: 0, futtermenge: 0, eier: false, offeneBrut: false, verdeckelteBrut: false, nachschaffung: false, schwarmzellen: false, weiselbecher: false, koeniginGesehen: false, koeniginJahr: "", honigwaben: "", futtergabe: "", notiz: "" });
  const [skDetail, setSkDetail] = useState(null);
  const [voiceListening, setVoiceListening] = useState(false);
  const [voiceText, setVoiceText] = useState("");
  const [voiceSupported] = useState(() => typeof window !== "undefined" && ("SpeechRecognition" in window || "webkitSpeechRecognition" in window));
  const [wissenView, setWissenView] = useState("aktuell");
  const [wissenTag, setWissenTag] = useState(null);
  const [showGame, setShowGame] = useState(false);

  const parseVoice = useCallback((text) => {
    const t = text.toLowerCase();
    const update = {};
    // Volk
    voelker.forEach(v => {
      if (t.includes(v.name.toLowerCase())) update.volkId = v.id;
    });
    const volkMatch = t.match(/volk\s*(\d)/);
    if (volkMatch) {
      const vn = voelker.find(v => v.name.toLowerCase().includes("volk " + volkMatch[1]) || v.name.includes(volkMatch[1]));
      if (vn) update.volkId = vn.id;
    }
    // Stärke
    if (t.match(/stärke.{0,8}(stark|sehr gut)/)) update.staerke = 4;
    else if (t.match(/stärke.{0,8}gut/)) update.staerke = 3;
    else if (t.match(/stärke.{0,8}mäßig/)) update.staerke = 2;
    else if (t.match(/stärke.{0,8}schwach/)) update.staerke = 1;
    if (t.includes("stark") && !t.match(/stärke/)) update.staerke = 4;
    // Wabensitz
    if (t.match(/wabensitz.{0,8}(sehr gut|super)/)) update.wabensitz = 4;
    else if (t.match(/wabensitz.{0,8}gut/)) update.wabensitz = 3;
    else if (t.match(/wabensitz.{0,8}mäßig/)) update.wabensitz = 2;
    else if (t.match(/wabensitz.{0,8}gering/)) update.wabensitz = 1;
    // Sanftmut
    if (t.match(/sanft|sehr sanft|friedlich|brav/)) update.sanftmut = 4;
    else if (t.match(/ruhig/)) update.sanftmut = 3;
    else if (t.match(/unruhig|nervös/)) update.sanftmut = 2;
    else if (t.match(/stechlustig|aggressiv|stechen/)) update.sanftmut = 1;
    // Futter
    if (t.match(/futter.{0,8}(viel|genug|reichlich)/)) update.futtermenge = 4;
    else if (t.match(/futter.{0,8}(ausreichend|okay|ok)/)) update.futtermenge = 3;
    else if (t.match(/futter.{0,8}wenig/)) update.futtermenge = 2;
    else if (t.match(/futter.{0,8}(leer|nichts|kein)/)) update.futtermenge = 1;
    // Brut
    if (t.match(/eier\s*(ja|gesehen|vorhanden|da)/) || t.match(/(stifte|eier)\s+ja/)) update.eier = true;
    if (t.match(/eier.{0,4}(nein|keine|nicht)/)) update.eier = false;
    if (t.match(/offene\s*brut\s*(ja|gesehen|da|vorhanden)/) || t.match(/offene\s*brut/) && !t.match(/offene\s*brut.{0,4}(nein|keine)/)) update.offeneBrut = true;
    if (t.match(/verdeckelte?\s*brut/)) update.verdeckelteBrut = true;
    // Weiselzellen
    if (t.match(/schwarmzelle/)) update.schwarmzellen = !t.match(/schwarmzelle.{0,6}(nein|keine|nicht)/);
    if (t.match(/nachschaffung/)) update.nachschaffung = !t.match(/nachschaffung.{0,6}(nein|keine|nicht)/);
    if (t.match(/weiselbecher/)) update.weiselbecher = !t.match(/weiselbecher.{0,6}(nein|keine|nicht)/);
    // Königin
    if (t.match(/königin.{0,8}(gesehen|ja|da|gefunden)/)) update.koeniginGesehen = true;
    if (t.match(/königin.{0,8}(nicht|nein)/)) update.koeniginGesehen = false;
    // Honigwaben
    const honigMatch = t.match(/(\d+)\s*(honig\s*waben|waben\s*entnommen|waben\s*honig|waben\s*raus)/);
    if (honigMatch) update.honigwaben = honigMatch[1];
    // Futtergabe
    const futterMatch = t.match(/(\d+[.,]?\d*)\s*(kilo|kg)\s*(gefüttert|futter|gegeben)/);
    if (futterMatch) update.futtergabe = futterMatch[1].replace(",", ".");
    // Notiz — rest of text as fallback
    return update;
  }, [voelker]);

  const startVoice = useCallback(() => {
    if (!voiceSupported) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SR();
    recognition.lang = "de-DE";
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    let finalText = "";
    recognition.onstart = () => { setVoiceListening(true); setVoiceText("🎙️ Sprich jetzt..."); };
    recognition.onresult = (e) => {
      let interim = "";
      for (let i = 0; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript + " ";
        else interim += e.results[i][0].transcript;
      }
      setVoiceText(finalText + interim);
    };
    recognition.onend = () => {
      setVoiceListening(false);
      if (finalText.trim()) {
        const parsed = parseVoice(finalText);
        setSkForm(prev => {
          const updated = { ...prev };
          Object.keys(parsed).forEach(k => { updated[k] = parsed[k]; });
          if (!updated.notiz && finalText.trim()) updated.notiz = finalText.trim();
          return updated;
        });
        setVoiceText("✅ Erkannt: " + finalText.trim());
      } else {
        setVoiceText("");
      }
    };
    recognition.onerror = (e) => {
      setVoiceListening(false);
      if (e.error === "not-allowed") setVoiceText("❌ Mikrofon nicht erlaubt — bitte Berechtigung erteilen");
      else setVoiceText("❌ Fehler: " + e.error);
    };
    recognition.start();
    // Auto-stop after 15s
    setTimeout(() => { try { recognition.stop(); } catch(e) {} }, 15000);
    // Store ref to allow manual stop
    window._serbeeRecognition = recognition;
  }, [voiceSupported, parseVoice]);

  const stopVoice = useCallback(() => {
    if (window._serbeeRecognition) { try { window._serbeeRecognition.stop(); } catch(e) {} }
    setVoiceListening(false);
  }, []);

  useEffect(() => { saveData("sz_voelker", voelker); }, [voelker]);
  useEffect(() => { saveData("sz_kontrollen", kontrollen); }, [kontrollen]);
  useEffect(() => { saveData("sz_notizen", notizen); }, [notizen]);
  useEffect(() => { saveData("sz_standort", standort); setTrachten(getTrachtenForLat(standort.lat || 48.14)); }, [standort]);
  useEffect(() => { saveData("sz_ernten", ernten); }, [ernten]);
  useEffect(() => { saveData("sz_stockkarten", stockkarten); }, [stockkarten]);

  // Fetch weather
  const fetchWeather = useCallback((loc) => {
    setWeatherLoaded(false);
    setWeatherError(null);
    setWeather({});
    const base = "https://api.open-meteo.com/v1/forecast";
    const params = new URLSearchParams({
      latitude: loc.lat,
      longitude: loc.lon,
      daily: "temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,weather_code,wind_speed_10m_max,sunrise,sunset,uv_index_max",
      hourly: "temperature_2m,precipitation_probability,weather_code,relative_humidity_2m,wind_speed_10m",
      timezone: "auto",
      forecast_days: "14",
    });
    const url = base + "?" + params.toString();
    fetch(url)
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(data => {
        if (data.error) throw new Error(data.reason || "API-Fehler");
        if (!data.daily) throw new Error("Keine Tagesdaten");
        const d = data.daily;
        const w = {};
        d.time.forEach((t, i) => {
          w[t] = {
            max: Math.round(d.temperature_2m_max[i]),
            min: Math.round(d.temperature_2m_min[i]),
            rain: d.precipitation_sum[i] ?? 0,
            rainProb: d.precipitation_probability_max[i] ?? 0,
            code: d.weather_code?.[i] ?? null,
            wind: Math.round(d.wind_speed_10m_max?.[i] ?? 0),
            windDir: 0,
            sunrise: d.sunrise?.[i],
            sunset: d.sunset?.[i],
            uv: Math.round(d.uv_index_max?.[i] ?? 0),
          };
        });
        const h = data.hourly;
        if (h) {
          h.time.forEach((t, i) => {
            const dayKey = t.substring(0, 10);
            const hour = parseInt(t.substring(11, 13));
            if (w[dayKey]) {
              if (!w[dayKey].hourly) w[dayKey].hourly = [];
              w[dayKey].hourly.push({
                hour,
                temp: Math.round(h.temperature_2m[i]),
                rainProb: h.precipitation_probability?.[i] ?? 0,
                code: h.weather_code?.[i] ?? null,
                humidity: h.relative_humidity_2m?.[i] ?? 0,
                wind: Math.round(h.wind_speed_10m?.[i] ?? 0),
              });
            }
          });
        }
        setWeather(w);
        setWeatherLoaded(true);
      })
      .catch(err => {
        console.error("Weather fetch error:", err);
        setWeatherError(String(err.message || err));
        setWeatherLoaded(true);
      });
  }, []);

  useEffect(() => { fetchWeather(standort); }, [standort, fetchWeather]);

  // Geocoding search
  const searchOrt = useCallback(() => {
    if (!searchCity.trim()) return;
    setSearching(true);
    setSearchResults([]);
    fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(searchCity.trim())}&count=6&language=de&format=json`)
      .then(r => r.json())
      .then(data => {
        if (data.results) {
          setSearchResults(data.results.map(r => ({
            name: `${r.name}${r.admin1 ? ', ' + r.admin1 : ''}${r.country ? ' (' + r.country + ')' : ''}`,
            lat: r.latitude,
            lon: r.longitude,
          })));
        } else {
          setSearchResults([]);
        }
        setSearching(false);
      })
      .catch(() => { setSearching(false); });
  }, [searchCity]);

  const selectStandort = (loc) => {
    setStandort(loc);
    setShowOrtAuswahl(false);
    setSearchResults([]);
    setSearchCity("");
  };

  const windDir = (deg) => {
    const dirs = ["N","NNO","NO","ONO","O","OSO","SO","SSO","S","SSW","SW","WSW","W","WNW","NW","NNW"];
    return dirs[Math.round(deg / 22.5) % 16];
  };

  const toggleKontrolle = (dateKey, volkId) => {
    setKontrollen(prev => {
      const k = { ...prev }; if (!k[dateKey]) k[dateKey] = {};
      k[dateKey][volkId] = !k[dateKey][volkId]; return k;
    });
  };

  const saveNote = () => {
    if (!selectedDate || !noteText.trim()) return;
    const key = fmt(selectedDate);
    setNotizen(prev => {
      const n = { ...prev }; if (!n[key]) n[key] = [];
      n[key] = [...n[key], { text: noteText, volkId: noteVolk }]; return n;
    });
    setNoteText(""); setNoteVolk(null);
  };

  const deleteNote = (dateKey, idx) => {
    setNotizen(prev => {
      const n = { ...prev }; n[dateKey] = n[dateKey].filter((_, i) => i !== idx);
      if (n[dateKey].length === 0) delete n[dateKey]; return n;
    });
  };

  const addVolk = () => {
    if (!newVolkName.trim() || voelker.length >= 5) return;
    const colors = ["#f59e0b","#60a5fa","#34d399","#f87171","#a78bfa"];
    setVoelker(prev => [...prev, { id: Date.now(), name: newVolkName.trim(), color: colors[prev.length % colors.length] }]);
    setNewVolkName(""); setShowAddVolk(false);
  };

  const removeVolk = (id) => setVoelker(prev => prev.filter(v => v.id !== id));
  const prevMonth = () => { if (month === 0) { setMonth(11); setYear(y => y-1); } else setMonth(m => m-1); };
  const nextMonth = () => { if (month === 11) { setMonth(0); setYear(y => y+1); } else setMonth(m => m+1); };

  const daysInMonth = getDaysInMonth(year, month);
  const firstDay = getFirstDayOfMonth(year, month);
  const isSchwarmzeit = (date) => isInRange(date, SCHWARMZEIT.start, SCHWARMZEIT.end, year);
  const getTrachten = (date) => trachten.filter(t => isInRange(date, t.start, t.end, year));
  const hasKontrolle = (dk) => kontrollen[dk] && Object.values(kontrollen[dk]).some(Boolean);
  const hasNotiz = (dk) => notizen[dk] && notizen[dk].length > 0;
  const isToday = (day) => day === TODAY.getDate() && month === TODAY.getMonth() && year === TODAY.getFullYear();
  const isSelected = (day) => selectedDate && day === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear();

  const getNextKontrolle = () => {
    const t = new Date();
    if (!isSchwarmzeit(t)) return null;
    const allDates = Object.keys(kontrollen).filter(k => hasKontrolle(k)).sort().reverse();
    if (allDates.length === 0) return "Heute starten!";
    const last = parseD(allDates[0]);
    const diff = Math.floor((t - last) / 86400000);
    if (diff >= 7) return `Überfällig! (${diff} Tage)`;
    return `Nächste in ${7 - diff} Tag${7-diff===1?'':'en'}`;
  };

  const forecastDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(TODAY); d.setDate(d.getDate() + i);
    const key = fmt(d);
    if (weather[key]) forecastDays.push({ date: d, key, ...weather[key] });
  }

  const beeScore = (w) => {
    if (!w) return 3;
    let s = 3;
    if (w.max >= 15 && w.max <= 28) s++;
    if (w.max >= 20 && w.max <= 25) s++;
    if (w.rain < 1) s++; if (w.rainProb < 30) s++; if (w.wind < 20) s++;
    if (w.rain > 5) s -= 2; if (w.wind > 30) s -= 2; if (w.max < 12) s -= 2;
    return Math.max(1, Math.min(5, s));
  };
  const beeScoreLabel = (s) => {
    if (s >= 5) return { text: "Ideal", color: "#4ade80", emoji: "🐝" };
    if (s >= 4) return { text: "Gut", color: "#a3e635", emoji: "🐝" };
    if (s >= 3) return { text: "OK", color: "#fbbf24", emoji: "🐝" };
    if (s >= 2) return { text: "Mäßig", color: "#fb923c", emoji: "😐" };
    return { text: "Schlecht", color: "#f87171", emoji: "❌" };
  };

  const selectedDateKey = selectedDate ? fmt(selectedDate) : null;
  const selectedTrachten = selectedDate ? getTrachten(selectedDate) : [];
  const selectedWeather = selectedDateKey ? weather[selectedDateKey] : null;
  const selectedNotizen = selectedDateKey && notizen[selectedDateKey] ? notizen[selectedDateKey] : [];

  // --- Shared inline style helpers ---
  const pill = (bg, color, border) => ({ padding: "5px 11px", borderRadius: 16, border: `1.5px solid ${border}`, background: bg, fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", gap: 5 });
  const sectionTitle = { fontSize: 11, fontWeight: 700, color: C.textDim, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 6 };
  const card = { background: C.surface, borderRadius: 14, padding: 16, border: `1px solid ${C.border}` };

  return (
    <div style={{ background: C.bg, minHeight: "100vh", fontFamily: "'DM Sans','Inter',system-ui,sans-serif", color: C.text }}>
      <div style={{ maxWidth: 760, margin: "0 auto", padding: "0 14px 40px" }}>

        {/* ══ HEADER ══ */}

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>

              <p style={{ fontSize: 13, color: C.textMuted, margin: "3px 0 0" }}>Dein Imkereiplaner</p>
            </div>
            {getNextKontrolle() && (

            }}>
              📍 {standort.name}
              <span style={{ fontSize: 10, color: C.textDim }}>({standort.lat.toFixed(2)}, {standort.lon.toFixed(2)})</span>
              <span style={{ fontSize: 11, color: C.textDim }}>{showOrtAuswahl ? "▲" : "▼"}</span>
            </button>
          </div>

          {/* Ortsauswahl-Dropdown */}
          {showOrtAuswahl && (

              <span style={{ fontSize: 20, lineHeight: 1 }}>{icon}</span>

            </button>

        {/* ═══════════ STOCKKARTE TAB ═══════════ */}

          const EMPTY_SK = { datum: fmt(TODAY), volkId: null, staerke: 0, wabensitz: 0, sanftmut: 0, futtermenge: 0, eier: false, offeneBrut: false, verdeckelteBrut: false, nachschaffung: false, schwarmzellen: false, weiselbecher: false, koeniginGesehen: false, koeniginJahr: "", honigwaben: "", futtergabe: "", notiz: "" };

          const skForVolk = skVolkId
            ? stockkarten.filter(s => s.volkId === skVolkId).sort((a,b) => b.datum.localeCompare(a.datum))
            : stockkarten.sort((a,b) => b.datum.localeCompare(a.datum));

          const saveSk = () => {
            setStockkarten(prev => [...prev, { ...skForm, id: Date.now() }]);
            setSkForm({...EMPTY_SK, volkId: skForm.volkId });
            setShowSkForm(false);
          };
          const deleteSk = (id) => setStockkarten(prev => prev.filter(s => s.id !== id));

          const RatingRow = ({ label, value, onChange, options }) => (
            <div style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: C.textMuted, marginBottom: 5 }}>{label}</div>
              <div style={{ display: "flex", gap: 4 }}>
                {options.map((opt, i) => (
                  <button key={i} onClick={() => onChange(i + 1)} style={{
                    flex: 1, padding: "8px 4px", borderRadius: 8, border: "none", cursor: "pointer",
                    fontSize: 12, fontWeight: 600, transition: "all 0.15s",
                    background: value === i + 1
                      ? i < options.length * 0.33 ? "#ef4444" : i < options.length * 0.66 ? C.accent : C.success
                      : C.surfaceLight,
                    color: value === i + 1 ? "#000" : C.textDim,
                  }}>{opt}</button>
                ))}
              </div>
            </div>
          );

          const Toggle = ({ label, emoji, value, onChange }) => (
            <button onClick={() => onChange(!value)} style={{
              padding: "8px 12px", borderRadius: 10, border: "none", cursor: "pointer",
              fontSize: 12, fontWeight: 600, display: "flex", alignItems: "center", gap: 5,
              background: value ? C.successDim : C.surfaceLight,
              color: value ? C.success : C.textDim,
              transition: "all 0.15s",
            }}>
              <span style={{ fontSize: 15 }}>{emoji}</span> {label} {value ? "✓" : ""}
            </button>
          );

          const ratingLabel = (val, options) => val > 0 && val <= options.length ? options[val - 1] : "–";
          const ratingColor = (val, max) => val <= 0 ? C.textDim : val <= max * 0.33 ? "#ef4444" : val <= max * 0.66 ? C.accent : C.success;

          return (
            <div>
              {/* Volk-Auswahl */}
              <div style={{ display: "flex", gap: 4, marginBottom: 12, flexWrap: "wrap" }}>
                <button onClick={() => setSkVolkId(null)} style={{
                  padding: "7px 14px", borderRadius: 9, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 700,
                  background: !skVolkId ? C.accentGlow : C.surface, color: !skVolkId ? C.accent : C.textMuted,
                  border: `1px solid ${!skVolkId ? C.accent + "44" : C.border}`,
                }}>Alle</button>
                {voelker.map(v => (
                  <button key={v.id} onClick={() => { setSkVolkId(v.id); setSkForm(f => ({...f, volkId: v.id})); }} style={{
                    padding: "7px 14px", borderRadius: 9, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 700,
                    background: skVolkId === v.id ? `${v.color}22` : C.surface,
                    color: skVolkId === v.id ? v.color : C.textMuted,
                    border: `1px solid ${skVolkId === v.id ? v.color + "66" : C.border}`,

                    <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: v.color, marginRight: 5 }} />

              </div>

              {/* Neue Durchsicht */}
              <div style={{ ...card, marginBottom: 14, padding: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: showSkForm ? 14 : 0 }}>
                  <h3 style={{ ...sectionTitle, margin: 0 }}>📋 Neue Durchsicht</h3>
                  <button onClick={() => setShowSkForm(!showSkForm)} style={{
                    background: C.accent, color: "#000", border: "none", borderRadius: 8, padding: "6px 14px", cursor: "pointer", fontWeight: 700, fontSize: 12,

                </div>

                {showSkForm && (
                  <div style={{ marginTop: 12 }}>
                    {/* Voice Input */}
                    {voiceSupported && (

                            {voiceText}

                        {!voiceListening && !voiceText && (
                          <div style={{ marginTop: 6, fontSize: 11, color: C.textDim, lineHeight: 1.5 }}>

        {/* ═══════════ WETTER TAB ═══════════ */}

                      </div>

                        <div>💧 {w.rain}mm ({w.rainProb}%)</div>

                      </div>

                      {hot.length > 0 && <p style={{ margin: "0 0 6px" }}>🌡️ <strong>Heiß:</strong> {hot.map(d => `${WEEKDAYS_FULL[(d.date.getDay()+6)%7]} (${d.max}°)`).join(", ")} — Wasserversorgung sicherstellen.</p>}

        {activeTab === "region" && (() => {
          // Dynamische Richtwerte basierend auf aktiven Trachten und Breitengrad
          const lat = standort.lat || 48;
          const refData = {
            "Löwenzahn":    { kg: "3–10",  hinweis: "Witterungsabhängig, nur bei starken Wiesen-Beständen ergiebig" },
            "Obstblüte":    { kg: "5–12",  hinweis: lat > 50 ? "Spätfrost-Risiko, stark witterungsabhängig" : lat < 46 ? "Frühe und meist sichere Tracht, oft schon Ende März" : "Stark witterungsabhängig, Spätfrost-Risiko möglich" },
            "Raps":         { kg: "10–25", hinweis: "Sehr gute Tracht wenn Rapsfelder in Flugreichweite, schnell kristallisierend — rechtzeitig schleudern!" },
            "Robinie":      { kg: lat < 46 ? "15–30" : "5–15", hinweis: lat < 46 ? "In Südosteuropa Haupttracht! Akazienhonig sehr begehrt" : lat > 52 ? "Nur punktuell in Parks und Alleen, nicht überall verfügbar" : "Punktuell möglich, kurze aber intensive Blüte" },
            "Linde":        { kg: "8–20",  hinweis: "Sommerlinde ab Mitte Juni, Winterlinde ab Juli. Gute Bestände in Parks und Alleen" },
            "Wald/Honigtau":{ kg: lat > 46 ? "0–30+" : "0–15", hinweis: lat > 46 ? "Sehr variabel! Hängt von Lachniden-Entwicklung ab. In guten Jahren Spitzenerträge" : "Weniger relevant in Tieflagen Südeuropas, eher in Mittelgebirgs- und Alpenregionen" },
            "Sonnenblume":  { kg: lat < 46 ? "10–25" : "3–10", hinweis: lat < 46 ? "In Südosteuropa Massentracht! Riesige Anbauflächen, sehr ergiebig" : "Nur bei Anbau in der Nähe relevant" },
            "Akazie":       { kg: "15–30", hinweis: "Haupttracht in Rumänien, Ungarn, Serbien — einer der wertvollsten Sortenhonige Europas" },
            "Heide":        { kg: "5–15",  hinweis: "Wichtige Spättracht in Norddeutschland (Lüneburger Heide), spezielle Ernte nötig (pressen)" },
            "Wiesenblumen": { kg: "5–15",  hinweis: "Klee, Kräuter und Wildblumen — typische Sommertracht in Grünlandgebieten" },
            "Phacelia":     { kg: "5–15",  hinweis: "Wird als Zwischenfrucht angebaut, schließt das Juniloch zwischen Raps und Linde" },
          };
          const REF = trachten.map(function(t) {
            var rd = refData[t.name] || { kg: "3–15", hinweis: "Regionale Erfahrungswerte" };
            var startM = MONTHS[t.start[0]]; var endM = MONTHS[t.end[0]];
            return { tracht: t.name, emoji: t.emoji, color: t.color, kg: rd.kg, zeit: startM + " – " + endM, hinweis: rd.hinweis };
          });

          // Dynamische Links basierend auf Region
          var regionalLinks = [];
          if (lat >= 47 && lat <= 49.5 && standort.lon >= 9 && standort.lon <= 14) {
            // Bayern / Österreich
            regionalLinks.push({ name: "TrachtNet Bayern — Stockwaagen", url: "https://www.trachtnet.de", desc: "Tagesaktuelle Waagendaten aus Bayern, u.a. Oberbayern und Schwaben" });
            regionalLinks.push({ name: "Bezirk Oberbayern — Bienenstockwaagen", url: "https://www.bezirk-oberbayern.de/Umwelt/Fachberatung-f%C3%BCr-Imkerei/Bienenstockwaagen/", desc: "Stockwaagen der Fachberatung für Imkerei in Oberbayern" });
            regionalLinks.push({ name: "Waldtrachtbeobachter Süd", url: "https://www.waldtrachtbeobachter-sued.de", desc: "Honigtau-Prognosen für Süddeutschland und Alpenraum" });
          } else if (lat >= 47 && lat <= 49.5 && standort.lon < 9) {
            // Baden-Württemberg / Schweiz
            regionalLinks.push({ name: "Waldtrachtbeobachter Süd", url: "https://www.waldtrachtbeobachter-sued.de", desc: "Honigtau-Prognosen für Süddeutschland" });
            regionalLinks.push({ name: "TrachtNet Baden-Württemberg", url: "https://www.trachtnet.de", desc: "Waagendaten aus dem Südwesten" });
          } else if (lat > 49.5 && lat <= 55) {
            // Nord-/Mitteldeutschland
            regionalLinks.push({ name: "TrachtNet Deutschland", url: "https://www.trachtnet.de", desc: "Tagesaktuelle Waagendaten aus ganz Deutschland" });
          } else if (lat < 47) {
            // Südeuropa
            regionalLinks.push({ name: "Apimondia", url: "https://www.apimondia.com", desc: "Internationaler Imkerverband — Konferenzen und Forschung weltweit" });
          }
          // Immer dabei
          regionalLinks.push({ name: "BeeScales.io — Öffentliche Waagen", url: "https://public.beescales.io", desc: "Öffentlich einsehbare Stockwaagen-Daten aus ganz Europa" });
          regionalLinks.push({ name: "HoneyPi — Open Source Stockwaage", url: "https://honey-pi.de", desc: "Selbstbau-Stockwaage auf Raspberry Pi Basis, Community-Daten" });
          var LINKS = regionalLinks;
          const thisYear = TODAY.getFullYear();
          const thisYearErnten = ernten.filter(e => e.datum && e.datum.startsWith(String(thisYear)));
          const totalKg = thisYearErnten.reduce((s, e) => s + (parseFloat(e.kg) || 0), 0);
          const byTracht = {};
          thisYearErnten.forEach(e => { if (e.tracht) { byTracht[e.tracht] = (byTracht[e.tracht] || 0) + (parseFloat(e.kg) || 0); } });
          const byVolk = {};
          thisYearErnten.forEach(e => { const v = voelker.find(vk => vk.id === e.volkId); const name = v ? v.name : "Unbekannt"; byVolk[name] = (byVolk[name] || 0) + (parseFloat(e.kg) || 0); });

          const addErnte = () => {

            setShowAddErnte(false);

          return (

                      <div style={{ fontSize: 11, color: C.textDim, marginBottom: 4 }}>Pro Volk (Ø)</div>
                      <div style={{ fontSize: 22, fontWeight: 700, color: C.text }}>{voelker.length ? (totalKg / voelker.length).toFixed(1) : "–"} kg</div>

                    <div style={{ background: C.surfaceLight, borderRadius: 12, padding: "12px 18px", flex: 2, minWidth: 180 }}>
                      <div style={{ fontSize: 11, color: C.textDim, marginBottom: 6 }}>Nach Tracht</div>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        {Object.entries(byTracht).map(([t, kg]) => {

                    </select>
                    <input value={noteText} onChange={e => setNoteText(e.target.value)} placeholder="Notiz..." style={{ flex: 1, border: `1.5px solid ${C.border}`, borderRadius: 8, padding: "6px 10px", fontSize: 13, outline: "none", background: C.surfaceLight, color: C.text }} onKeyDown={e => e.key === 'Enter' && saveNote()} />
                    <button onClick={saveNote} disabled={!noteText.trim()} style={{ background: C.accent, color: "#000", border: "none", borderRadius: 8, padding: "6px 14px", cursor: "pointer", fontWeight: 700, fontSize: 16, opacity: noteText.trim() ? 1 : 0.4 }}>+</button>
                  </div>
                </div>
              </div>
            )}

            <div style={{ display: "flex", flexWrap: "wrap", gap: 14, padding: "10px 0", fontSize: 11, color: C.textDim }}>
              <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 12, height: 12, borderRadius: 4, background: C.schwarm, border: `1px solid ${C.schwarmBorder}44` }} /> Schwarmzeit</span>
              <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ color: C.success, fontWeight: 700 }}>✓</span> Kontrolle</span>
              <span style={{ display: "flex", alignItems: "center", gap: 4 }}>📝 Notiz</span>
            </div>
          </div>
        )}
      </div>

      {/* ═══════════ GAME OVERLAY (Easter Egg) ═══════════ */}
      {showGame && (<div style={{ position: "fixed", inset: 0, zIndex: 9999, background: "#000" }}>
        <button onClick={() => setShowGame(false)} style={{ position: "fixed", top: 12, right: 12, zIndex: 10000, background: "rgba(0,0,0,0.6)", color: "#fff", border: "2px solid rgba(255,255,255,0.3)", borderRadius: "50%", width: 40, height: 40, cursor: "pointer", fontSize: 18, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
        <iframe src="game.html" style={{ width: "100%", height: "100%", border: "none" }} allow="autoplay" />
      </div>)}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SchwarmzeitKalender));
setTimeout(function() { var s = document.getElementById('splash'); if (s) s.classList.add('hide'); setTimeout(function() { if (s) s.remove(); }, 500); }, 800);
</script>
</body>
</html>
